name: RuleBound CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    name: Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Step 1 - Master 5-Part System Audit Scorecard
        run: python run.py --verify-all

      - name: Step 2 - Master Room Output & Proposal Generation
        run: python run.py --input data --output OUTPUT

      - name: Step 3 - Official JSON Schema Conformance Check
        run: python tools/validate_output.py OUTPUT

      - name: Step 4 - Multi-Run Byte-for-Byte Determinism Proof
        run: python tools/check_determinism.py --command "python run.py --input {input} --output {output}" --input data --work-dir .determinism-check

      - name: Step 5 - Comprehensive 17-Test Unit Suite
        run: python run.py --check
